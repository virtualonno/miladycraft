# System Milady's launch layer: how this game directory starts, read before the game loads.
# Each mechanism is off, shadow, auto or on. auto runs the stock path on the first start with a new mod set and
# checks the faster path against it; only a check with zero differences lets later starts take the faster path,
# and any difference, or a start that never finished, keeps that mod set on the stock path.
# A missing or malformed file means every mechanism runs stock. -Dsystemmilady.<key>=<mode> overrides one key.
gameLayer=auto
mixinPrefilter=off
launchClaimFilter=off
