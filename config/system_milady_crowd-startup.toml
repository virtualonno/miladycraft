#Enable crowd drills. false (the default): nothing is registered but a command that says so.
enabled = true
#How many synthetic identities exist. Every drill reuses them, so what drills leave in other
#mods' per-player stores is bounded by this number. A drill can hold at most this many players.
# Default: 1000
# Range: 1 ~ 9999
poolSize = 1000
#Synthetic players' names: this prefix and a zero-padded index (sm.0001). The default's dot
#cannot appear in a Mojang account name; use a letters-only prefix if a mod rejects it.
namePrefix = "sm."
#Allow drills while players outside the pool are online. false: a summon or run is
#refused while any are online, and a run stops when one logs in (unless its scenario says realPlayers allow).
besidePlayers = false
#Players with permission level 4 are observers: they may be online during a drill
#without counting as real players for the gate or the stop condition.
operatorsObserve = true
#Synthetic players take no damage (so they never die, drop items or make graves).
invulnerable = true
#How long a direct summon lasts unless the command gives a duration.
# Default: 10
# Range: 1 ~ 360
summonMinutes = 10
