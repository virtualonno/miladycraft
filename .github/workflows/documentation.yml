name: Pack documentation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test catalogue and release behavior
        run: python -m unittest discover -s tools/minetiger-pack-docs -v
      - name: Verify pack, catalogue, release history and PDF receipt offline
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          args=()
          if [[ -n "$BASE" && "$BASE" != 0000000000000000000000000000000000000000 ]]; then
            args=(--base "$BASE")
          fi
          python tools/minetiger-pack-docs/pack_docs.py check "${args[@]}"
