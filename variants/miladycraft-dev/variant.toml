# Miladycraft Dev: the pack of the DEV server, the whitelisted flatgrass
# server for building and for trying mods on production hosting before they
# reach the SMP. It is this repository's pack plus the files in this
# directory, minus `remove`. `smoothstone pack derive --variant
# miladycraft-dev` regenerates the `miladycraft-dev` branch from the committed
# base; never edit that branch by hand.
#
# Author the overlay with Packwiz from this directory (`packwiz mr add <mod>`).
# An overlay file that shadows a base file is refused unless it is listed
# under `override`; a mod promoted to the SMP moves from here to `mods/`.
name = "Miladycraft Dev"
version-label = "dev"
remove = [
    # DEV has no Discord connection.
    "mods/simple-discord-link-bot-forge-fabric-spigot.pw.toml",
    # Whitelist plus online-mode already authenticate; no second password login.
    "mods/neoauth.pw.toml",
]
